<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Golf Log</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div class="container">
        <!-- Landing Page -->
        <div id="landingPage">
            <h1>🏌️ Golf Log</h1>
            <button onclick="showAddCourse()">Add a Course</button>
            <button onclick="showCourseSelect()">Score a Round</button>
        </div>

        <!-- Add Course Page -->
        <div id="addCoursePage" class="hidden">
            <h2>Add a Course</h2>
            <input type="text" id="courseName" placeholder="Course Name" />

            <div id="courseDetails"></div>

            <button onclick="saveCourse()">Save Course</button>
            <button onclick="goHome()">Back</button>
        </div>


        <div id="courseSelectPage" class="hidden">
            <h2>Select a Course</h2>
            <select id="courseDropdown" class="form-select mb-3"></select>
            <button onclick="confirmCourse()">Continue</button>
            <button onclick="goHome()">Back</button>
        </div>


        <!-- Score Round Page -->
        <div id="scoreRoundPage" class="hidden">
            <h2>Score a Round</h2>
            <form id="scoreForm">
                <div id="holesContainer"></div>
                <button type="submit">Save Scores</button>
            </form>
            <div class="total">Total Score: <span id="totalScore">0</span></div>
            <button onclick="goHome()">Back</button>
        </div>

        <!-- Course Select Page -->

    </div>

    <script src="app.js"></script>
</body>

</html>
