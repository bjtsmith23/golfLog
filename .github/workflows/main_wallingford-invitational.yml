# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - wallingford-invitational

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore web app
        run: dotnet restore GolfTrackerWeb/GolfTrackerWeb.csproj

      - name: Build web app
        run: dotnet build GolfTrackerWeb/GolfTrackerWeb.csproj --configuration Release --no-restore

      - name: Publish web app
        run: dotnet publish GolfTrackerWeb/GolfTrackerWeb.csproj --configuration Release --no-build --output "${{ github.workspace }}/publish"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: publish

  deploy:
    runs-on: windows-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_B0659663B0744EFCA85EB88C7535D627 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_DC90ED58981C4687AB9E8DF95AEEDD88 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_38714C16CB074FCFBB19B4C36502CCE9 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'wallingford-invitational'
          slot-name: 'Production'
          package: .
